name: CI

on:
  pull_request:
  push:
    branches: [main]

# Un nuevo push al mismo PR/rama cancela la ejecución anterior.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------
  # Servicios Java: compilación + unit tests (surefire) + integración
  # con Testcontainers (failsafe). Los runners ubuntu traen Docker.
  # ---------------------------------------------------------------
  java:
    name: java (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service: [api-gateway, auth-service, delivery-service]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: |
            services/${{ matrix.service }}/pom.xml
            services/${{ matrix.service }}/.mvn/wrapper/maven-wrapper.properties

      # Maven Wrapper: misma versión de Maven que en local y en Docker.
      - name: ./mvnw verify
        run: ./mvnw -B -ntp verify

      # HU-04: el check de JaCoCo (pom de delivery-service) ya hace fallar
      # "verify" si algorithm/ baja del 60%; aquí solo se publica el resultado.
      - name: Cobertura de algorithm/ (JaCoCo)
        if: always() && matrix.service == 'delivery-service' && hashFiles('services/delivery-service/target/site/jacoco/jacoco.csv') != ''
        run: |
          awk -F, 'NR > 1 && $2 ~ /\.algorithm$/ { covered += $9; missed += $8 }
            END { printf "### Cobertura de líneas en algorithm/: %.1f%% (%d de %d), mínimo 60%%\n", 100 * covered / (covered + missed), covered, covered + missed }' \
            target/site/jacoco/jacoco.csv >> "$GITHUB_STEP_SUMMARY"

      - name: Reporte de cobertura (JaCoCo)
        if: always() && matrix.service == 'delivery-service'
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-delivery-service
          path: services/delivery-service/target/site/jacoco/
          if-no-files-found: ignore

      - name: Reportes de tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.service }}
          path: |
            services/${{ matrix.service }}/target/surefire-reports/
            services/${{ matrix.service }}/target/failsafe-reports/
          if-no-files-found: ignore

  # ---------------------------------------------------------------
  # Proyectos Node: instalación reproducible, lint y build.
  # ---------------------------------------------------------------
  node:
    name: node (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        project: [services/import-service, frontend]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json

      - run: npm ci
      - run: npm run lint
      # Solo los proyectos con script "test" (hoy import-service) corren tests.
      - run: npm test --if-present
      - run: npm run build

  # ---------------------------------------------------------------
  # Construye las 5 imágenes del docker-compose sin publicarlas.
  # ---------------------------------------------------------------
  docker-build:
    name: docker-build (${{ matrix.image.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        image:
          - { name: api-gateway, context: services/api-gateway }
          - { name: auth-service, context: services/auth-service }
          - { name: delivery-service, context: services/delivery-service }
          - { name: import-service, context: services/import-service }
          - { name: frontend, context: frontend }
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: docker build ${{ matrix.image.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image.context }}
          push: false
          tags: lastmile/${{ matrix.image.name }}:ci
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}
