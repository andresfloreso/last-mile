server:
  port: 8081

spring:
  application:
    name: auth-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/authdb}
    username: ${SPRING_DATASOURCE_USERNAME:lastmile}
    # Sin valor por defecto: se toma de SPRING_DATASOURCE_PASSWORD (POSTGRES_PASSWORD en compose).
    password: ${SPRING_DATASOURCE_PASSWORD}
  flyway:
    # El esquema se versiona en src/main/resources/db/migration (HU-02).
    enabled: true
    locations: classpath:db/migration
    # Bases creadas antes de Flyway (con ddl-auto: update) se marcan como V1
    # en vez de fallar; una base vacía ejecuta V1 normalmente.
    baseline-on-migrate: true
    baseline-version: 1
  jpa:
    hibernate:
      # Hibernate NO modifica el esquema: solo valida que coincida con las entidades.
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

jwt:
  # Sin valor por defecto: si falta o tiene menos de 32 caracteres, el servicio
  # no arranca (ver JwtSecrets). En tests lo define src/test/resources/config/application.yml.
  secret: ${JWT_SECRET:}
  access-expiration-ms: ${JWT_EXPIRATION_MS:3600000}
  refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}

management:
  endpoints:
    web:
      exposure:
        include: health,info

# ADMIN inicial (HU-05): se crea al arrancar solo si no existe ningún ADMIN.
bootstrap:
  admin:
    email: ${BOOTSTRAP_ADMIN_EMAIL:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
