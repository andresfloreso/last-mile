server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: ${AUTH_SERVICE_URI:http://localhost:8081}
          predicates:
            - Path=/api/auth/**
        # Gestión de usuarios (HU-05): auth-service exige rol ADMIN con @PreAuthorize.
        - id: auth-service-users
          uri: ${AUTH_SERVICE_URI:http://localhost:8081}
          predicates:
            - Path=/api/users/**
        - id: delivery-service-shipments
          uri: ${DELIVERY_SERVICE_URI:http://localhost:8082}
          predicates:
            - Path=/api/shipments/**
        # Locales (HU-25): detalle y modulación declarada.
        - id: delivery-service-customers
          uri: ${DELIVERY_SERVICE_URI:http://localhost:8082}
          predicates:
            - Path=/api/customers/**
        # Vehículos (HU-29): camiones con capacidad y jornada.
        - id: delivery-service-vehicles
          uri: ${DELIVERY_SERVICE_URI:http://localhost:8082}
          predicates:
            - Path=/api/vehicles/**
        - id: delivery-service-routes
          uri: ${DELIVERY_SERVICE_URI:http://localhost:8082}
          predicates:
            - Path=/api/routes/**
        - id: delivery-service-tracking
          uri: ${DELIVERY_SERVICE_URI:http://localhost:8082}
          predicates:
            - Path=/api/tracking/**
        - id: delivery-service-geocoding
          uri: ${DELIVERY_SERVICE_URI:http://localhost:8082}
          predicates:
            - Path=/api/geocoding/**
        - id: import-service
          uri: ${IMPORT_SERVICE_URI:http://localhost:8083}
          predicates:
            - Path=/api/import/**
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
            allowedHeaders: "*"
            allowCredentials: true

jwt:
  # Sin valor por defecto: si falta o tiene menos de 32 caracteres, el servicio
  # no arranca (ver JwtSecrets). En tests lo define src/test/resources/config/application.yml.
  secret: ${JWT_SECRET:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
