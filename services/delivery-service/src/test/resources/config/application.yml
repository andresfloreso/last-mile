# Solo para tests: Spring Boot carga classpath:/config/application.yml además
# del application.yml principal (y con más prioridad). Nunca uses estos valores
# fuera de los tests.
jwt:
  secret: solo-para-tests-no-usar-en-ningun-ambiente
spring:
  datasource:
    # Testcontainers (@ServiceConnection) entrega la conexión real; este valor
    # solo evita que el placeholder sin default quede sin resolver.
    password: test
routing:
  optimizer:
    # HU-28: el solver corta antes en los tests que arman rutas (RouteRegressionIT usa su propio límite).
    time-limit: 3s
    unimproved-time-limit: 1s
