server:
  port: 8082

spring:
  application:
    name: delivery-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/deliverydb}
    username: ${SPRING_DATASOURCE_USERNAME:lastmile}
    # Sin valor por defecto: se toma de SPRING_DATASOURCE_PASSWORD (POSTGRES_PASSWORD en compose).
    password: ${SPRING_DATASOURCE_PASSWORD}
  flyway:
    # El esquema se versiona en src/main/resources/db/migration (HU-02).
    enabled: true
    locations: classpath:db/migration
    # Bases creadas antes de Flyway (con ddl-auto: update) se marcan como V1
    # en vez de fallar; una base vacía ejecuta V1 normalmente.
    baseline-on-migrate: true
    baseline-version: 1
  jpa:
    hibernate:
      # Hibernate NO modifica el esquema: solo valida que coincida con las entidades.
      ddl-auto: validate
    show-sql: false

jwt:
  # Sin valor por defecto: si falta o tiene menos de 32 caracteres, el servicio
  # no arranca (ver JwtSecrets). En tests lo define src/test/resources/config/application.yml.
  secret: ${JWT_SECRET:}

geocoding:
  # Nominatim (OpenStreetMap) — mismo dataset que usa Leaflet en el frontend,
  # para que el pin del mapa y la dirección geocodificada coincidan siempre.
  nominatim-url: ${NOMINATIM_URL:https://nominatim.openstreetmap.org}
  # La política de Nominatim exige un User-Agent que identifique la app y un contacto.
  user-agent: ${NOMINATIM_USER_AGENT:LastMilePlatform/1.0 (contacto@lastmile.cl)}
  # HU-09: máximo 1 request por segundo (política del servidor público).
  # Con una instancia propia de Nominatim se puede bajar.
  min-interval: ${GEOCODING_MIN_INTERVAL:1s}
  # place_rank mínimo para considerar preciso un resultado: 28 = número de calle,
  # 30 = edificio. Por debajo (calle, barrio, comuna) el local queda "revisar".
  min-place-rank: ${GEOCODING_MIN_PLACE_RANK:28}
  # Direcciones en la caché en memoria (una dirección repetida no vuelve a consultar).
  cache-size: 10000

routing:
  # OSRM (Open Source Routing Machine) — distancias reales por calle en vez
  # de línea recta. Se puede apuntar a un servidor propio en producción para
  # no depender del límite de tasa del demo público.
  osrm-url: ${OSRM_URL:https://router.project-osrm.org}
  # HU-32: la hora estimada de una ruta ya armada no vuelve a consultar OSRM mientras su orden no cambie.
  osrm-route-cache:
    size: 64     # rutas que recuerda (0 la apaga)
    ttl: 6h
  # HU-14: hora estimada por parada.
  default-departure: "08:00"   # salida del depósito si la request no la indica
  stop-minutes: 10             # minutos de entrega en cada local
  fallback-speed-kmh: 25       # velocidad urbana para estimar tramos cuando OSRM no responde
  # HU-28: optimizador de la ruta del día.
  optimizer:
    engine: timefold             # timefold (VRPTW de un camión) o nearest-neighbor (HU-04)
    time-limit: 10s              # tiempo máximo del solver
    unimproved-time-limit: 3s    # corta antes si pasa este tiempo sin mejorar

shipments:
  # HU-29: peso y volumen de un envío que no los informa (API o planilla sin peso_kg / volumen_m3).
  # Los envíos que existían antes de la migración V4 quedaron con 10 kg y 0,05 m³.
  default-weight-kg: 10
  default-volume-m3: 0.05

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
