# Healthcheck común de los servicios Spring Boot (Actuator). Las imágenes
# runtime son Alpine, que trae wget (busybox).
x-spring-healthcheck: &spring-healthcheck
  interval: 10s
  timeout: 5s
  retries: 12
  start_period: 40s

networks:
  lastmile-net:
    driver: bridge

volumes:
  postgres-data:
  redis-data:

services:
  # ---------------------------------------------------------------
  # Infraestructura
  # ---------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: lastmile-postgres
    environment:
      POSTGRES_MULTIPLE_DATABASES: authdb,deliverydb
      POSTGRES_USER: lastmile
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env (ver .env.example)}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init-multi-db.sh:/docker-entrypoint-initdb.d/init-multi-db.sh
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lastmile"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [lastmile-net]

  redis:
    image: redis:7-alpine
    container_name: lastmile-redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?Define REDIS_PASSWORD en .env (ver .env.example)}"]
    environment:
      # redis-cli lo usa para autenticarse (healthcheck) sin exponer la clave en argumentos.
      REDISCLI_AUTH: ${REDIS_PASSWORD:?Define REDIS_PASSWORD en .env (ver .env.example)}
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [lastmile-net]

  # ---------------------------------------------------------------
  # Microservicios backend (Java / Spring Boot)
  # ---------------------------------------------------------------
  auth-service:
    build: ./services/auth-service
    container_name: lastmile-auth-service
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/authdb
      SPRING_DATASOURCE_USERNAME: lastmile
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env (ver .env.example)}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en .env (mínimo 32 caracteres, ver .env.example)}
      JWT_EXPIRATION_MS: 3600000
      JWT_REFRESH_EXPIRATION_MS: 604800000
      # ADMIN inicial (HU-05): solo se crea si no existe ningún ADMIN.
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      # #44: B2B, sin registro público. Con true, POST /api/auth/register crea CLIENT.
      PUBLIC_REGISTRATION_ENABLED: ${PUBLIC_REGISTRATION_ENABLED:-false}
      # Sin perfil "seed": los datos de ejemplo solo se cargan en desarrollo,
      # con docker-compose.override.yml (ver infra/seed/README.md).
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-default}
    ports:
      - "8081:8081"
    healthcheck:
      <<: *spring-healthcheck
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/actuator/health | grep -q UP"]
    networks: [lastmile-net]

  delivery-service:
    build: ./services/delivery-service
    container_name: lastmile-delivery-service
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/deliverydb
      SPRING_DATASOURCE_USERNAME: lastmile
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env (ver .env.example)}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en .env (mínimo 32 caracteres, ver .env.example)}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-default}
      NOMINATIM_URL: ${NOMINATIM_URL:-https://nominatim.openstreetmap.org}
      NOMINATIM_USER_AGENT: ${NOMINATIM_USER_AGENT:-LastMilePlatform/1.0 (contacto@lastmile.cl)}
      GEOCODING_MIN_INTERVAL: ${GEOCODING_MIN_INTERVAL:-1s}
      GEOCODING_MIN_PLACE_RANK: ${GEOCODING_MIN_PLACE_RANK:-28}
    ports:
      - "8082:8082"
    healthcheck:
      <<: *spring-healthcheck
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8082/actuator/health | grep -q UP"]
    networks: [lastmile-net]

  # ---------------------------------------------------------------
  # Microservicio de importación de documentos (Node / TypeScript)
  # ---------------------------------------------------------------
  import-service:
    build: ./services/import-service
    container_name: lastmile-import-service
    depends_on:
      delivery-service:
        condition: service_healthy
    environment:
      PORT: 8083
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en .env (mínimo 32 caracteres, ver .env.example)}
      DELIVERY_SERVICE_URL: http://delivery-service:8082
    ports:
      - "8083:8083"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8083/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    networks: [lastmile-net]

  # ---------------------------------------------------------------
  # API Gateway (Spring Cloud Gateway) — punto único de entrada
  # ---------------------------------------------------------------
  api-gateway:
    build: ./services/api-gateway
    container_name: lastmile-api-gateway
    depends_on:
      auth-service:
        condition: service_healthy
      delivery-service:
        condition: service_healthy
      import-service:
        condition: service_healthy
    environment:
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en .env (mínimo 32 caracteres, ver .env.example)}
      AUTH_SERVICE_URI: http://auth-service:8081
      DELIVERY_SERVICE_URI: http://delivery-service:8082
      IMPORT_SERVICE_URI: http://import-service:8083
    ports:
      - "8080:8080"
    healthcheck:
      <<: *spring-healthcheck
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health | grep -q UP"]
    networks: [lastmile-net]

  # ---------------------------------------------------------------
  # Frontend (React + Vite + TypeScript)
  # ---------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      # Las VITE_* se leen al construir. Vacías = mapa base Esri (HU-27).
      args:
        VITE_TILE_URL_LIGHT: ${VITE_TILE_URL_LIGHT:-}
        VITE_TILE_URL_DARK: ${VITE_TILE_URL_DARK:-}
        VITE_TILE_ATTRIBUTION: ${VITE_TILE_ATTRIBUTION:-}
        VITE_TILE_MAX_NATIVE_ZOOM: ${VITE_TILE_MAX_NATIVE_ZOOM:-}
    container_name: lastmile-frontend
    depends_on:
      api-gateway:
        condition: service_healthy
    environment:
      VITE_API_BASE_URL: http://localhost:8080
    ports:
      - "5173:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
    networks: [lastmile-net]
